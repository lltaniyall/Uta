<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONG DATABASE | 谷谷</title><link rel="stylesheet" href="../style.css"></head><body>
<header><a class="logo" href="../">TANIYA<span>_</span></a><nav><a href="../archive/">ARCHIVE</a><a href="./">SONGS</a></nav></header>
<main><section class="hero"><p class="eyebrow">SONG DATABASE</p><h1>SONGS</h1><p>曲名・配信名・日付から横断検索。クリックすると該当する日付別アーカイブの、その歌唱位置へ直接移動します。</p></section>
<section class="section"><div class="toolbar"><label class="search"><span>SEARCH</span><input id="search" type="search" placeholder="曲名・配信名・日付を検索…"></label><div class="stats"><strong id="count">0</strong><span>SONGS</span></div></div><div id="results"></div><p id="empty" hidden>該当する曲がありません。</p></section></main><footer><b>TANIYA</b><span>SONG DATABASE</span></footer>
<script src="../data/archives.js"></script><script>
const $=s=>document.querySelector(s);const fmt=x=>{x=Math.floor(x||0);let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`};
function render(q=""){q=q.toLowerCase().trim();let total=0,out="";ARCHIVES.forEach(a=>{const ss=a.songs.filter(s=>s.type==="song"&&(`${s.title} ${a.title} ${a.date}`).toLowerCase().includes(q));total+=ss.length;if(ss.length)out+=`<div class="group"><div class="groupHead"><h3>${a.title}</h3><span>${a.date}</span></div>${ss.map(s=>`<a class="song" href="../archive/${a.date}/?t=${s.time}"><span class="time">${fmt(s.time)}</span><b>${s.title}</b><span class="muted datecol">${a.date}</span><span>↗</span></a>`).join("")}</div>`});$("#results").innerHTML=out;$("#count").textContent=total;$("#empty").hidden=!!total}$("#search").oninput=e=>render(e.target.value);render();
</script></body></html>
